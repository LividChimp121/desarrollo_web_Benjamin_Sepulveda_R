# Puerto donde corre Spring Boot.
# Flask usa el 5000, por eso esta parte nueva corre en el 8080.
server.port=8080

# Conexion a la misma base de datos que usa Flask.
# Asi Spring puede leer actividades y guardar notas en tarea_web_4.
spring.datasource.url=jdbc:mysql://localhost:3306/tarea_web_4
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No dejamos que Spring cree o cambie tablas automaticamente,
# porque la estructura de la base ya viene del proyecto y del SQL.
spring.jpa.hibernate.ddl-auto=none

# Muestra en la terminal las consultas SQL que hace Spring.
# Sirve para revisar que de verdad este buscando y guardando datos.
spring.jpa.show-sql=true
